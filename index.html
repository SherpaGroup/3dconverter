<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Asset Viewer and Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">3D Converter</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-lg-8 offset-lg-2">
                <div class="card bg-light shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title text-center mb-4">Upload Your 3D Model</h5>
                        <div class="text-center">
                            <input type="file" id="fileInput" class="form-control">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-5">
            <div class="col-md-6">
                <h3 class="text-center">Original Preview</h3>
                <div id="preview" class="border rounded-3" style="height: 400px;"></div>
            </div>
            <div class="col-md-6">
                <h3 class="text-center">Conversion</h3>
                <div class="card">
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="formatSelect" class="form-label">Convert to:</label>
                            <select id="formatSelect" class="form-select">
                                <option value="obj">OBJ</option>
                                <option value="fbx">FBX</option>
                                <option value="stl">STL</option>
                            </select>
                        </div>
                        <button id="convertBtn" class="btn btn-primary w-100">
                            <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                            Convert
                        </button>
                    </div>
                </div>

                <div id="result" class="mt-4">
                    <h3 class="text-center">Converted Preview</h3>
                    <div id="convertedPreview" class="border rounded-3" style="height: 400px;"></div>
                    <a id="downloadLink" class="btn btn-success w-100 mt-3 d-none" href="#" download>Download Converted File</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
